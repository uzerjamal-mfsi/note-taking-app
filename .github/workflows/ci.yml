name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: note_app
          POSTGRES_PASSWORD: note_app
          POSTGRES_DB: note_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U note_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://note_app:note_app@localhost:5432/note_app?schema=public
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @note-taking-app/db exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @note-taking-app/db exec prisma migrate deploy

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: note_app
          POSTGRES_PASSWORD: note_app
          POSTGRES_DB: note_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U note_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://note_app:note_app@localhost:5432/note_app?schema=public
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @note-taking-app/db exec prisma generate

      # Explicit so the schema is guaranteed up to date before Playwright's webServer starts the
      # API; `pretest:e2e` repeats it locally.
      - name: Apply database migrations
        run: pnpm --filter @note-taking-app/db exec prisma migrate deploy

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @note-taking-app/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e/.api.log
          if-no-files-found: ignore
          retention-days: 7
