services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-note_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-note_app}
      POSTGRES_DB: ${POSTGRES_DB:-note_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-note_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
